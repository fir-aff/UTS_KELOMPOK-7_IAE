<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <a href="index.html">Kembali ke Halaman User</a>
    </header>

    <div class="top-grid">
        <section class="panel">
            <div class="panel-header">
                <h2>Driver Service</h2>
            </div>
            <div class="lok_btn">
                <button id="refreshDriversBtn">Refresh Drivers</button>
                <button class="add-new-btn" id="add-driver-btn">+ Tambah Driver</button>
            </div>
            <table id="driver-table">
                <thead>
                    <tr>
                        <th>Driver ID</th>
                        <th>Nama</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="driver-list-body"></tbody>
            </table>
        </section>

        <section class="panel">
             <div class="panel-header">
                <h2>Order Service</h2>
            </div>
            <button id="refreshOrdersBtn">Refresh All Orders</button>
            <table id="order-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>User ID</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Driver ID</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="order-list-body"></tbody>
            </table>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Restaurant Service</h2>
            </div>
            <div class="lok_btn">
                <button id="refreshRestosBtn">Refresh Restaurants</button>
                <button class="add-new-btn" id="add-resto-btn">+ Tambah Resto</button>
            </div>
            <table id="resto-table">
                <thead>
                    <tr>
                        <th>Resto ID</th>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="resto-list-body"></tbody>
            </table>
        </section>

        <section class="panel">
             <div class="panel-header">
                <h2>User Service</h2>
            </div>
            <div class="lok_btn">
                <button id="refreshUsersBtn">Refresh Users</button>
                <button class="add-new-btn" id="add-user-btn">+ Tambah User</button>
            </div>
            <table id="user-table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Nama</th>
                        <th>Email</th>
                        <th>Alamat</th>
                        <th>Aksi</th>
                        </tr>
                </thead>
                <tbody id="user-list-body"></tbody>
            </table>
        </section>
    </div>

    <section id="menu-panel" class="panel full-width hidden">
        <h2 id="menu-panel-title"></h2>
        
        <input type="hidden" id="menu-resto-id-input">
        
        <hr>
        
        <button type="button" id="add-menu-btn" class="submit-btn green" style="align-self: flex-start; margin-bottom: 1rem;">
            Tambah Menu Baru
        </button>
        
        <hr>

        <h3>Daftar Menu Saat Ini</h3>
        <div class="table-container">
            <table id="menu-list-table">
                <thead>
                    <tr>
                        <th>Menu ID</th>
                        <th>Nama</th>
                        <th>Harga</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="menu-list-body"></tbody>
            </table>
        </div>
    </section>

    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close-btn" id="modal-close-btn">&times;</span>
            
            <h2 id="modal-title">Edit Item</h2>
            
            <form id="modal-form">
                <div id="modal-form-body"></div>
                
                <input type="hidden" id="modal-item-id">
                <input type="hidden" id="modal-service-type">
                
                <hr>
                
                <button type="submit" class="submit-btn green">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
