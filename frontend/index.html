<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Food Delivery Dashboard</h1>
        <div class="profile-box">
            <strong>Profil Pengguna (User ID: 1)</strong>
            <p>Nama: <span id="user-name">Memuat...</span></p>
            <p>Alamat: <span id="user-address">Memuat...</span></p>
        </div>
    </header>

    <main>
        <section id="restaurants">
            <h2>1. Pilih Restoran</h2>
            <ul id="restaurant-list">
                </ul>
        </section>

        <section id="menu">
            <h2>2. Pilih Menu</h2>
            <h3 id="selected-resto-name">Silakan pilih restoran...</h3>
            <ul id="menu-list">
                </ul>
        </section>

        <section id="order-section">
            <h2>3. Keranjang Pesanan</h2>
            <div id="cart-item">
                <p>Belum ada item dipilih.</p>
            </div>
            <button id="createOrderBtn" disabled>Buat Pesanan (sebagai User 1)</button>
            
            <hr>

            <h2>Riwayat Pesanan (Auto-Refresh 5 dtk)</h2>
            <div id="order-history-container">
                <table id="order-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Driver ID</th>
                            <th>Aksi</th> </tr>
                    </thead>
                    <tbody id="order-list-body">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
