<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Food Delivery Dashboard</h1>
        <div class="profile-box">
            <strong>Profil Pengguna</strong>
            <p>Nama: <span id="user-name">-Belum Login-</span></p>
            <p>Alamat: <span id="user-address">-</span></p>
        </div>
        <a href="admin.html" class="admin-link">Pergi ke Halaman Admin</a>
    </header>

    <main class="user-main">

        <section id="user-selection" class="panel">
            <h2>1. Login (dari User Service)</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" id="login-btn">Login</button>
                <button type="button" id="logout-btn" class="hidden">Logout</button>
            </form>
            <p id="login-status"></p>
        </section>

        <section id="restaurant-selection" class="panel hidden">
            <h2>2. Pilih Restoran & Menu</h2>
            <label for="restaurant-dropdown">Pilih Restoran:</label>
            <select id="restaurant-dropdown">
                <option value="">--Login dulu--</option>
            </select>
            <div id="menu-container" class="hidden">
                <hr>
                <h3>Menu yang Tersedia:</h3>
                <ul id="menu-list"></ul>
            </div>
        </section>

        <section id="order-creation" class="panel hidden">
            <h2>3. Keranjang & Pesan</h2>
            <div id="cart">
                <h4>Keranjang Anda:</h4>
                <ul id="cart-list">
                    <li>Login dulu</li>
                </ul>
                <div id="cart-total">
                    <strong>Total: Rp<span id="cart-total-price">0</span></strong>
                </div>
            </div>
            <button id="createOrderBtn" disabled>Kirim Pesanan</button>
        </section>

    </main>

    <section id="history-section" class="panel hidden">
        <h2>Riwayat Pesanan (Auto-Refresh 5 dtk)</h2>
        <div id="order-history-container">
            <table id="order-table">
                </table>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
